[package]
name = "grpsqlite-sim"
description = "Deterministic simulation (VOPR), repro tests and benchmarks for gRPSQLite."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "vopr"
path = "src/bin/vopr.rs"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[dependencies]
grpsqlite = { workspace = true, features = ["static"] }
grpsqlite-memory.workspace = true
log.workspace = true
parking_lot.workspace = true
rusqlite.workspace = true
tokio.workspace = true
tonic.workspace = true
xxhash-rust.workspace = true
