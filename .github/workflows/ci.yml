name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --features grpsqlite/dynamic -- -D warnings
      - run: cargo test --workspace
      - name: SQLite shell and examples
        run: scripts/build-sqlite && scripts/smoke

  simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: VOPR seeded by the commit
        run: |
          seed=$((16#${GITHUB_SHA:0:15}))
          cargo run --release -p grpsqlite-sim --bin vopr -- "$seed" --seeds 2000
