[workspace]
resolver = "3"
members = ["crates/proto", "crates/vfs", "crates/memory", "crates/sim"]
exclude = ["vendor/sqlite-plugin"]

[workspace.package]
version = "0.2.0"
edition = "2024"
# File::try_lock, which keeps two processes off one page cache.
rust-version = "1.89"

[workspace.dependencies]
bytes = "1"
grpsqlite = { path = "crates/vfs" }
grpsqlite-memory = { path = "crates/memory" }
grpsqlite-proto = { path = "crates/proto" }
log = { version = "0.4.34", features = ["std"] }
parking_lot = "0.13"
prost = "0.14"
rusqlite = { version = "0.41", features = ["bundled"] }
sqlite-plugin = { version = "0.11", default-features = false }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
tonic = "0.14"
tonic-prost = "0.14"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }

[patch.crates-io]
sqlite-plugin = { path = "vendor/sqlite-plugin" }
